name: PR Unit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build addon
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Validate Storybook 11 compatibility
        run: |
          npm install --no-save --legacy-peer-deps storybook@next
          npm run build
          npm test
